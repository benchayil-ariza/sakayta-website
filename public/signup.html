<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SakayTa - Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-su">

<main class="su-page">
  <div class="su-wrap">
    <a href="/login.html" class="su-back" aria-label="Back to log in" onclick="event.preventDefault(); authNavigate('/login.html','login');">&#8592;</a>
    <a href="/index.html"><img class="su-logo" src="/assets/logo-icon.png" alt="SakayTa" /></a>

    <h1>Create your SakayTa account</h1>
    <p class="su-sub">Book rides as a passenger, or accept rides as a driver.</p>

    <div class="auth-field">
      <label for="signupName">Full name</label>
      <input type="text" id="signupName" placeholder="Enter your full name" />
    </div>
    <div class="auth-field">
      <label for="signupIdentifier">Email or mobile number</label>
      <input type="text" id="signupIdentifier" placeholder="Email or mobile number" />
    </div>
    <div class="auth-field">
      <label for="signupPassword">Password</label>
      <div class="input-icon-wrap">
        <input type="password" id="signupPassword" class="has-toggle" placeholder="Create a password" />
        <button type="button" class="icon-right" onclick="togglePw('signupPassword', this)" aria-label="Show password">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.5 5.3A11 11 0 0112 5c7 0 11 7 11 7a13.2 13.2 0 01-3.2 3.9M6.6 6.6A13.5 13.2 0 001 12s4 7 11 7a10.7 10.7 0 004.4-.9"/></svg>
        </button>
      </div>
    </div>
    <div class="auth-field">
      <label for="signupConfirm">Confirm password</label>
      <input type="password" id="signupConfirm" placeholder="Confirm your password" />
    </div>

    <div class="auth-field">
      <label id="accountTypeLabel">Account type</label>
      <div class="account-type-grid" role="radiogroup" aria-labelledby="accountTypeLabel">
        <div class="account-type-card selected" data-type="passenger" role="radio" aria-checked="true" tabindex="0">
          <div class="t">Passenger</div>
          <div class="d">Book rides and track my driver.</div>
        </div>
        <div class="account-type-card" data-type="driver" role="radio" aria-checked="false" tabindex="0">
          <div class="t">Driver</div>
          <div class="d">Accept rides and earn from trips.</div>
        </div>
      </div>
    </div>

    <p id="signupError" class="field-error" role="alert" style="margin-top: 12px;" hidden></p>
    <button class="primary auth-submit" id="signupBtn">Create Account</button>
    <span id="signupSpinner" class="spinner" hidden aria-hidden="true"></span>

    <p class="su-terms">By creating an account, you agree to SakayTa's Terms of Service and Privacy Policy.</p>
    <a href="/login.html" class="su-have" onclick="event.preventDefault(); authNavigate('/login.html','login');">I already have an account</a>
  </div>
</main>

<script src="/js/auth-transition.js"></script>
<script>
  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    const openIcon = btn.querySelector(".eye-open");
    const closedIcon = btn.querySelector(".eye-closed");
    openIcon.style.display = isPassword ? "none" : "block";
    closedIcon.style.display = isPassword ? "block" : "none";
    btn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
  }

  let selectedRole = "passenger";
  document.querySelectorAll(".account-type-card").forEach((card) => {
    card.addEventListener("click", () => selectAccountType(card));
    card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectAccountType(card); } });
  });
  function selectAccountType(card) {
    document.querySelectorAll(".account-type-card").forEach((c) => { c.classList.remove("selected"); c.setAttribute("aria-checked", "false"); });
    card.classList.add("selected");
    card.setAttribute("aria-checked", "true");
    selectedRole = card.dataset.type;
  }

  // Handle signup form submission
  document.getElementById("signupBtn").addEventListener("click", async () => {
    const nameInput = document.getElementById("signupName");
    const identifierInput = document.getElementById("signupIdentifier");
    const passwordInput = document.getElementById("signupPassword");
    const confirmInput = document.getElementById("signupConfirm");
    const errorEl = document.getElementById("signupError");
    const btn = document.getElementById("signupBtn");
    const spinner = document.getElementById("signupSpinner");

    const full_name = nameInput.value.trim();
    const identifier = identifierInput.value.trim();
    const password = passwordInput.value;
    const confirm_password = confirmInput.value;

    errorEl.hidden = true;

    if (!full_name || !identifier || !password || !confirm_password) {
      errorEl.textContent = "All fields are required.";
      errorEl.hidden = false;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating account...";
    spinner.hidden = false;

    try {
      const res = await fetch("http://localhost:8088/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier, full_name, password, confirm_password, role: selectedRole }),
      });

      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error || "Registration failed. Please try again.";
        errorEl.hidden = false;
        btn.disabled = false;
        btn.textContent = "Create Account";
        spinner.hidden = true;
        return;
      }

      // Store token in localStorage
      localStorage.setItem("sakayta_token", data.token);
      localStorage.setItem("sakayta_user", JSON.stringify(data.user));

      // Redirect to appropriate page based on role
      if (data.user.role === "driver") {
        window.location.href = "/driver.html";
      } else {
        window.location.href = "/passenger.html";
      }
    } catch (err) {
      errorEl.textContent = "Network error. Please check your connection.";
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = "Create Account";
      spinner.hidden = true;
    }
  });
</script>
<script src="/js/navbar-auth.js"></script>
</body>
</html>
