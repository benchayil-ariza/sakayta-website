<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SakayTa - Log In</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-fb">

<main class="fb-login">

  <section class="fb-left">
  <a href="/index.html" class="fb-logo">
    <img src="/assets/logo-icon.png" alt="SakayTa" />
  </a>

  <img class="fb-art" src="/assets/login-art.jpg" alt="" />

  <h1>Your ride<br>starts <span>here.</span></h1>
</section>

  <section class="fb-right">
    <div class="fb-card">
      <h2>Log into SakayTa</h2>

      <div class="auth-field">
        <input type="text" id="loginIdentifier" placeholder="Email or mobile number" aria-label="Email or mobile number" />
      </div>
      <div class="auth-field">
        <div class="input-icon-wrap">
          <input type="password" id="loginPassword" class="has-toggle" placeholder="Password" aria-label="Password" />
          <button type="button" class="icon-right" onclick="togglePw('loginPassword', this)" aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.5 5.3A11 11 0 0112 5c7 0 11 7 11 7a13.2 13.2 0 01-3.2 3.9M6.6 6.6A13.5 13.2 0 001 12s4 7 11 7a10.7 10.7 0 004.4-.9"/></svg>
          </button>
        </div>
      </div>

      <p id="loginError" class="field-error" role="alert" style="margin: 12px 0;" hidden></p>
      <button class="primary auth-submit" id="loginBtn">Log In</button>
      <span id="loginSpinner" class="spinner" hidden aria-hidden="true"></span>

      <div class="auth-forgot"><a href="/forgot-password.html">Forgot password?</a></div>
      <hr class="fb-divider" />
      <a href="/signup.html" class="fb-create" onclick="event.preventDefault(); authNavigate('/signup.html','signup');">Create new account</a>
    </div>
  </section>

</main>

<script src="/js/auth-transition.js"></script>
<script>
  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    const openIcon = btn.querySelector(".eye-open");
    const closedIcon = btn.querySelector(".eye-closed");
    openIcon.style.display = isPassword ? "none" : "block";
    closedIcon.style.display = isPassword ? "block" : "none";
    btn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
  }

  // Handle login form submission
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const identifierInput = document.getElementById("loginIdentifier");
    const passwordInput = document.getElementById("loginPassword");
    const errorEl = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");
    const spinner = document.getElementById("loginSpinner");

    const identifier = identifierInput.value.trim();
    const password = passwordInput.value;

    errorEl.hidden = true;

    if (!identifier || !password) {
      errorEl.textContent = "Email/mobile and password are required.";
      errorEl.hidden = false;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Logging in...";
    spinner.hidden = false;

    try {
      const res = await fetch("http://localhost:8088/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error || "Login failed. Please try again.";
        errorEl.hidden = false;
        btn.disabled = false;
        btn.textContent = "Log In";
        spinner.hidden = true;
        return;
      }

      // Store token in localStorage
      localStorage.setItem("sakayta_token", data.token);
      localStorage.setItem("sakayta_user", JSON.stringify(data.user));

      // Redirect to appropriate page based on role
      if (data.user.role === "driver") {
        window.location.href = "/driver.html";
      } else if (data.user.role === "admin") {
        window.location.href = "/admin.html";
      } else {
        window.location.href = "/passenger.html";
      }
    } catch (err) {
      errorEl.textContent = "Network error. Please check your connection.";
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = "Log In";
      spinner.hidden = true;
    }
  });
</script>
<script src="/js/navbar-auth.js"></script>
</body>
</html>
