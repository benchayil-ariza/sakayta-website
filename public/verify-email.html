<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SakayTa - Verify your email</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  [hidden] { display: none !important; }
  .otp-input { text-align: center; letter-spacing: 10px; font-size: 26px !important; font-weight: 800; padding-left: 24px !important; }
  .otp-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .otp-link { background: none !important; border: none !important; box-shadow: none !important; padding: 6px 8px !important; width: auto !important;
              font: inherit; font-size: 14px; font-weight: 700; color: #2F7D55 !important; cursor: pointer; border-radius: 8px; }
  .otp-link:hover:not(:disabled) { background: rgba(47, 125, 85, 0.1) !important; }
  .otp-link:disabled { color: #606770 !important; cursor: default; }
  .otp-msg { min-height: 22px; margin: 14px 0 0; font-size: 14px; line-height: 1.4; color: #606770; }
  .otp-msg.err { color: #b3392b; }
  .otp-msg.ok { color: #2F7D55; }
</style>
</head>
<body class="auth-su">

<main class="su-page">
  <div class="su-wrap">
    <a href="/login.html" class="su-back" aria-label="Back to log in">&#8592;</a>
    <a href="/index.html"><img class="su-logo" src="/assets/logo-icon.png" alt="SakayTa" /></a>

    <section id="stepEmail">
      <h1>Create your SakayTa account</h1>
      <p class="su-sub">First, enter your email. We will send you a 6-digit code to confirm that it is yours.</p>
      <form id="emailForm" novalidate>
        <div class="auth-field">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="you@gmail.com" />
        </div>
        <button type="submit" class="primary auth-submit" id="sendBtn">Send code</button>
      </form>
    </section>

    <section id="stepCode" hidden>
      <h1>Check your email</h1>
      <p class="su-sub">We sent a 6-digit code to <strong id="sentTo"></strong>. It works for 10 minutes. Check your Spam folder too.</p>
      <form id="codeForm" novalidate>
        <div class="auth-field">
          <label for="code">Verification code</label>
          <input type="text" id="code" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
        </div>
        <button type="submit" class="primary auth-submit" id="verifyBtn">Verify</button>
      </form>
      <div class="otp-row">
        <button type="button" id="resendBtn" class="otp-link">Resend code</button>
        <button type="button" id="changeBtn" class="otp-link">Change email</button>
      </div>
    </section>

    <p id="msg" class="otp-msg" role="status" aria-live="polite"></p>
    <a href="/login.html" class="su-have">I already have an account</a>
  </div>
</main>

<script>
(function () {
  var API = "http://localhost:8088/api/auth/otp";
  var KEY = "sakayta_email_verified";
  var $ = function (id) { return document.getElementById(id); };
  var email = "", timer = null;

  function say(text, kind) {
    var m = $("msg");
    m.textContent = text || "";
    m.className = "otp-msg" + (kind ? " " + kind : "");
  }
  function show(step) {
    $("stepEmail").hidden = step !== "email";
    $("stepCode").hidden = step !== "code";
    say("");
    (step === "email" ? $("email") : $("code")).focus();
  }
  function post(path, body) {
    return fetch(API + path, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        return { ok: r.ok, status: r.status, data: d || {} };
      });
    });
  }
  function countdown(seconds) {
    var btn = $("resendBtn");
    clearInterval(timer);
    function tick() {
      if (seconds <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = "Resend code"; return; }
      btn.disabled = true; btn.textContent = "Resend code in " + seconds + "s"; seconds--;
    }
    tick(); timer = setInterval(tick, 1000);
  }

  function sendCode(isResend) {
    var btn = $("sendBtn");
    btn.disabled = true; $("resendBtn").disabled = true;
    say("Sending the code…");
    return post("/send", { email: email }).then(function (res) {
      if (res.ok) {
        $("sentTo").textContent = email;
        show("code");
        countdown(res.data.resendAfterSeconds || 60);
        if (isResend) say("A new code was sent.", "ok");
      } else {
        say(res.data.error || "Something went wrong. Please try again.", "err");
        if (!$("stepCode").hidden) {
          if (res.status === 429 && res.data.retryAfter) countdown(res.data.retryAfter);
          else $("resendBtn").disabled = false;
        }
      }
    }).catch(function () {
      say("Could not reach the server. Check your connection and try again.", "err");
      if (!$("stepCode").hidden) $("resendBtn").disabled = false;
    }).then(function () { btn.disabled = false; });
  }

  $("emailForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("email").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { say("Enter a valid email address.", "err"); $("email").focus(); return; }
    email = v;
    sendCode(false);
  });
  $("resendBtn").addEventListener("click", function () { sendCode(true); });
  $("changeBtn").addEventListener("click", function () { clearInterval(timer); $("code").value = ""; show("email"); });
  $("code").addEventListener("input", function () { this.value = this.value.replace(/\D/g, "").slice(0, 6); });

  $("codeForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var code = $("code").value;
    if (code.length !== 6) { say("Enter the 6-digit code.", "err"); return; }
    var btn = $("verifyBtn");
    btn.disabled = true; say("Checking…");
    post("/verify", { email: email, code: code }).then(function (res) {
      if (res.ok && res.data.verified) {
        sessionStorage.setItem(KEY, JSON.stringify({
          email: email,
          token: res.data.emailToken,
          until: Date.now() + (res.data.validForSeconds || 1200) * 1000 - 15000
        }));
        say("Email verified. Taking you to the next step…", "ok");
        location.href = "/signup.html";
        return;
      }
      say(res.data.error || "That code is not correct.", "err");
      $("code").select(); btn.disabled = false;
    }).catch(function () {
      say("Could not reach the server. Try again.", "err"); btn.disabled = false;
    });
  });

  show("email");
})();
</script>
</body>
</html>
